# Sobe o PostgreSQL 16 do projeto Termometro.
# Os valores de usuario/senha/banco NAO ficam aqui: vem do arquivo .env local,
# que o .gitignore e os ganchos mantem fora do repositorio.
services:
  postgres:
    image: postgres:16
    container_name: termometro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5432 e a porta padrao do PostgreSQL; do lado esquerdo vem a porta do .env,
      # para nao brigar com outro Postgres que ja esteja rodando na maquina.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a `docker compose down`.
      # Sem ele, cada `up` comecaria com o banco vazio.
      - pgdata:/var/lib/postgresql/data
      # init.sql so roda quando o volume esta vazio (primeira subida):
      # e o PostgreSQL que executa tudo em /docker-entrypoint-initdb.d.
      - ./meu-loop-agente/workspace/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      # pg_isready responde "estou aceitando conexao?". O $$ escapa o $ para
      # o proprio container ler a variavel, e nao o compose aqui fora.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    # Constrói a imagem a partir do Dockerfile que está ao lado do código.
    build: ./meu-loop-agente/workspace/api
    container_name: termometro-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Dentro da rede do compose o banco é alcançado pelo NOME DO SERVIÇO
      # ("postgres"), não por localhost: localhost, aqui, seria o próprio
      # container da API.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        # Só sobe depois que o banco responder ao pg_isready. Sem isso, a API
        # tentaria conectar durante a inicialização do PostgreSQL e morreria.
        condition: service_healthy
    healthcheck:
      # A imagem slim não tem curl; o próprio Python faz a chamada.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
